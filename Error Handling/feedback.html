<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Get in Touch</title>
  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    span{
      color: red;
      
    }
  </style>
</head>
<body class="vh-100 d-flex align-items-center justify-content-center"
      style="background: linear-gradient(135deg, #e3f2fd, #f8f9fa);">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow border-0 rounded-4">
          <div class="card-body p-4">
            <h3 class="text-center mb-4">Get in Touch</h3>

            <form onsubmit="collectMsg(), event.preventDefault()">
              <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" id="fullname" placeholder="Enter your name" >
                <span id="errorfullname"></span>
              </div>

              <div class="mb-3">
                <label class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" placeholder="Enter your email" >
                <span id="erroremail"></span>
              </div>

              <div class="mb-3">
                <label class="form-label">Subject</label>
                <input type="text" class="form-control" id="subject" placeholder="Subject">
                <span id="errorsubject"></span>
              </div>

              <div class="mb-3">
                <label class="form-label">Message</label>
                <textarea class="form-control" rows="4" id="message" placeholder="Write your message..." ></textarea>
                <span id="errormessage"></span>
              </div>

              <div class="d-grid">
                <button type="submit" class="btn btn-primary rounded-3">Send Message</button>
              </div>
            </form>

          </div>
        </div>
      </div>
    </div>
  </div>

</body>
<script src="./feedback.js"></script>
</html>
